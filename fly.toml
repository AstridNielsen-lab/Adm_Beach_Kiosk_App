app = "AdmBeach"

[build]
  dockerfile = "Dockerfile"  # Verifique se o caminho está correto

[[services]]
  internal_port = 80
  force_https = true
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    soft_limit = 25
    hard_limit = 50
  [[services.ports]]
    handlers = ["http"]
    port = "80"
